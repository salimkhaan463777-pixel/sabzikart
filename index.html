
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SabziKart Admin</title>
<style>
body{font-family:Arial;background:#eff8f0;margin:0;padding:15px}
.box{max-width:500px;margin:20px auto;background:white;padding:20px;border-radius:14px;box-shadow:0 2px 10px #ccc}
h2{color:#16833b;text-align:center}
input,button{width:100%;padding:13px;margin:8px 0;box-sizing:border-box;font-size:16px;border-radius:8px}
input{border:1px solid #bbb}
button{border:0;background:#16833b;color:white;font-weight:bold}
.item{border:1px solid #ddd;padding:12px;margin:10px 0;border-radius:9px}
.red{background:#c62828}
.gray{background:#555}
#dashboard{display:none}
#message{overflow-wrap:anywhere}
</style>
</head>
<body>

<div class="box" id="loginBox">
<h2>🥬 SabziKart Admin</h2>
<input id="email" type="email" placeholder="Admin Email">
<input id="password" type="password" placeholder="Password">
<button id="login">Login</button>
<p id="message"></p>
</div>

<div class="box" id="dashboard">
<h2>🥬 SabziKart Dashboard</h2>
<h3>Add Vegetable</h3>
<input id="vegName" placeholder="Vegetable Name">
<input id="vegPrice" type="number" placeholder="Price per kg">
<button id="addVeg">Add Vegetable</button>
<p id="status"></p>
<hr>
<h3>Vegetable List</h3>
<div id="vegList">Loading...</div>
<button class="red" id="logout">Logout</button>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}
from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";
import {
getFirestore,collection,getDocs,addDoc,doc,updateDoc,deleteDoc
} from "https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js";

const firebaseConfig = {
apiKey:"AIzaSyCX2bu-_yJHLf7LwuXQmsKq2nOJ4xOARwU",
authDomain:"sabzikart-46468.firebaseapp.com",
projectId:"sabzikart-46468",
storageBucket:"sabzikart-46468.firebasestorage.app",
messagingSenderId:"881977965995",
appId:"1:881977965995:web:2846b9e527feea48dee6ee",
measurementId:"G-FBL2F0P1H8"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const loginBox=document.getElementById("loginBox");
const dashboard=document.getElementById("dashboard");
const message=document.getElementById("message");
const status=document.getElementById("status");
const vegList=document.getElementById("vegList");

document.getElementById("login").onclick=async()=>{
message.textContent="Login ho raha hai...";
try{
await signInWithEmailAndPassword(
auth,
document.getElementById("email").value.trim(),
document.getElementById("password").value
);
message.textContent="";
}catch(e){
message.textContent=e.code+": "+e.message;
}
};

onAuthStateChanged(auth,user=>{
if(user){
loginBox.style.display="none";
dashboard.style.display="block";
loadVegetables();
}else{
loginBox.style.display="block";
dashboard.style.display="none";
}
});

async function loadVegetables(){
vegList.textContent="Loading...";
try{
const snap=await getDocs(collection(db,"vegetables"));
vegList.innerHTML="";
if(snap.empty){
vegList.textContent="Abhi koi sabzi nahi hai.";
return;
}
snap.forEach(item=>{
const v=item.data();
const div=document.createElement("div");
div.className="item";

const name=document.createElement("b");
name.textContent=v.name || item.id;
const price=document.createElement("p");
price.textContent="Price: ₹"+(v.price ?? 0)+" per kg";
const available=document.createElement("p");
available.textContent="Status: "+(v.available ? "Available" : "Unavailable");

const priceInput=document.createElement("input");
priceInput.type="number";
priceInput.placeholder="New price";

const update=document.createElement("button");
update.textContent="Update Price";
update.onclick=async()=>{
const p=Number(priceInput.value);
if(priceInput.value==="" || !Number.isFinite(p) || p<0){
alert("Sahi price likho");
return;
}
try{
await updateDoc(doc(db,"vegetables",item.id),{price:p});
status.textContent="Price update ho gaya";
loadVegetables();
}catch(e){status.textContent=e.code+": "+e.message;}
};

const toggle=document.createElement("button");
toggle.className="gray";
toggle.textContent=v.available ? "Make Unavailable" : "Make Available";
toggle.onclick=async()=>{
try{
await updateDoc(doc(db,"vegetables",item.id),{available:!v.available});
loadVegetables();
}catch(e){status.textContent=e.code+": "+e.message;}
};

const remove=document.createElement("button");
remove.className="red";
remove.textContent="Delete";
remove.onclick=async()=>{
if(confirm("Is sabzi ko delete karna hai?")){
try{
await deleteDoc(doc(db,"vegetables",item.id));
loadVegetables();
}catch(e){status.textContent=e.code+": "+e.message;}
}
};

div.append(name,price,available,priceInput,update,toggle,remove);
vegList.appendChild(div);
});
}catch(e){
vegList.textContent=e.code+": "+e.message;
}
}

document.getElementById("addVeg").onclick=async()=>{
const name=document.getElementById("vegName").value.trim();
const priceText=document.getElementById("vegPrice").value;
const price=Number(priceText);
if(!name || priceText==="" || !Number.isFinite(price) || price<0){
status.textContent="Sabzi ka naam aur sahi price bharo.";
return;
}
try{
await addDoc(collection(db,"vegetables"),{
name:name,
price:price,
available:true
});
document.getElementById("vegName").value="";
document.getElementById("vegPrice").value="";
status.textContent="Sabzi add ho gayi!";
loadVegetables();
}catch(e){
status.textContent=e.code+": "+e.message;
}
};

document.getElementById("logout").onclick=()=>signOut(auth);
</script>
</body>
</html>
