
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SabziKart Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f8f5;font-family:Arial,sans-serif;color:#202820}
header{background:#12833b;color:white;padding:19px;text-align:center;font-size:24px;font-weight:bold}
.box{max-width:720px;margin:18px auto;background:white;padding:17px;border-radius:16px}
input,button{font-size:15px;padding:12px;border-radius:9px;border:1px solid #ddd}
input{width:100%;margin:6px 0}
button{background:#16833b;color:white;border:0;font-weight:bold;cursor:pointer}
.red{background:#d32f2f}
.gray{background:#555}
#dashboard{display:none}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.card{background:#fff;border:1px solid #e8eee8;border-radius:15px;padding:10px;box-shadow:0 3px 12px #172b1710;min-width:0}
.photo{width:100%;height:135px;object-fit:contain;background:#fff;border-radius:10px}
.card h3{font-size:15px;margin:9px 0 5px;min-height:34px}
.price{font-size:18px;color:#12833b;font-weight:bold}
.status{font-size:12px;margin:7px 0;color:#12833b}
.quantity{display:flex;align-items:center;justify-content:center;gap:13px;margin:10px 0}
.quantity button{width:34px;height:34px;padding:0;font-size:21px}
.quantity span{font-weight:bold;min-width:20px;text-align:center}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.actions button{font-size:11px;padding:9px 3px;margin:0}
.actions .red{grid-column:span 2}
h2{font-size:19px}
#message,#status{overflow-wrap:anywhere}
@media(max-width:350px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>🥬 SabziKart</header>

<div class="box" id="loginBox">
<h2>Admin Login</h2>
<input id="email" type="email" placeholder="Admin Email">
<input id="password" type="password" placeholder="Password">
<button id="login" style="width:100%">Login</button>
<p id="message"></p>
</div>

<div class="box" id="dashboard">
<h2>➕ Add New Vegetable</h2>
<input id="vegName" placeholder="Vegetable Name">
<input id="vegPrice" type="number" placeholder="Price per kg">
<input id="vegImage" placeholder="Photo URL (optional)">
<button id="addVeg" style="width:100%">+ Add Vegetable</button>
<p id="status"></p>
<hr>
<h2>🛒 Vegetable Collection</h2>
<div class="grid" id="vegList">Loading...</div>
<button class="red" id="logout" style="width:100%;margin-top:18px">Logout</button>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}
from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";
import {getFirestore,collection,getDocs,addDoc,doc,updateDoc,deleteDoc}
from "https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyCX2bu-_yJHLf7LwuXQmsKq2nOJ4xOARwU",
authDomain:"sabzikart-46468.firebaseapp.com",
projectId:"sabzikart-46468",
storageBucket:"sabzikart-46468.firebasestorage.app",
messagingSenderId:"881977965995",
appId:"1:881977965995:web:2846b9e527feea48dee6ee",
measurementId:"G-FBL2F0P1H8"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const photos={
potato:"https://sunagriindustries.com/wp-content/uploads/2026/01/Potato-300X300.jpeg",
tomato:"https://sunagriindustries.com/wp-content/uploads/2026/01/Tomato-300X300-2.jpg",
onion:"https://sunagriindustries.com/wp-content/uploads/2026/01/Onion-300X300.jpg",
cauliflower:"https://sunagriindustries.com/wp-content/uploads/2026/01/Cauliflower-300X300.jpg",
cabbage:"https://sunagriindustries.com/wp-content/uploads/2026/01/Cabbage-300X300.jpg",
brinjal:"https://sunagriindustries.com/wp-content/uploads/2026/01/Brinjal-300X300.jpg",
bhindi:"https://sunagriindustries.com/wp-content/uploads/2026/01/Okra-300X300.jpg",
okra:"https://sunagriindustries.com/wp-content/uploads/2026/01/Okra-300X300.jpg",
peas:"https://sunagriindustries.com/wp-content/uploads/2026/01/Peas-300X300.jpg",
beans:"https://sunagriindustries.com/wp-content/uploads/2026/01/Beans-300X300.jpg",
spinach:"https://sunagriindustries.com/wp-content/uploads/2026/01/Spinach-300X300.jpeg",
carrot:"https://sunagriindustries.com/wp-content/uploads/2026/01/Carrot-300X300.jpg",
radish:"https://sunagriindustries.com/wp-content/uploads/2026/01/Radish-300x300-1.jpg",
beetroot:"https://sunagriindustries.com/wp-content/uploads/2026/01/Beetroot-300X300.jpeg",
pumpkin:"https://sunagriindustries.com/wp-content/uploads/2026/01/Pumpkin-300X300.jpg",
karela:"https://sunagriindustries.com/wp-content/uploads/2026/01/Bitter-Gourd-300X300.jpg",
lauki:"https://sunagriindustries.com/wp-content/uploads/2026/01/Bottle-Gourd-300X300.jpg",
drumstick:"https://sunagriindustries.com/wp-content/uploads/2026/01/Drumstick-300X300-2.jpg",
cucumber:"https://sunagriindustries.com/wp-content/uploads/2026/01/Cucumber-300X300.jpg",
chilli:"https://sunagriindustries.com/wp-content/uploads/2026/01/Green-Chillies-300X300.jpg",
garlic:"https://sunagriindustries.com/wp-content/uploads/2026/01/Garlic-300X300-1.jpg",
turai:"https://sunagriindustries.com/wp-content/uploads/2026/01/Ridge-Gourd-300X300.jpg"
};

function getPhoto(item,v){
if(v.image && v.image.trim())return v.image;
const s=(item.id+" "+(v.name||"")).toLowerCase();
const aliases=[
["potato",["potato","aloo","आलू","બટાકા"]],
["tomato",["tomato","tamatar","टमाटर","ટામેટા"]],
["onion",["onion","pyaz","pyaaz","प्याज","ડુંગળી"]],
["cauliflower",["cauliflower","phool gobhi","फूलगोभी","ફૂલકોબી"]],
["cabbage",["cabbage","patta gobhi","पत्तागोभी","કોબી"]],
["brinjal",["brinjal","baingan","बैंगन","રીંગણ"]],
["bhindi",["bhindi","okra","lady finger","भिंडी","ભીંડા"]],
["peas",["peas","matar","मटर","વટાણા"]],
["beans",["beans","sem","सेम","ફણસી"]],
["spinach",["spinach","palak","पालक","પાલક"]],
["carrot",["carrot","gajar","गाजर","ગાજર"]],
["radish",["radish","mooli","मूली","મૂળા"]],
["beetroot",["beetroot","chukandar","चुकंदर","બીટ"]],
["pumpkin",["pumpkin","kaddu","कद्दू","કોળું"]],
["karela",["karela","bitter gourd","करेला","કારેલા"]],
["lauki",["lauki","bottle gourd","दूधी","लौकी","દૂધી"]],
["drumstick",["drumstick","sahjan","सहजन","સરગવો"]],
["cucumber",["cucumber","kheera","खीरा","કાકડી"]],
["chilli",["chilli","mirchi","मिर्च","મરચાં"]],
["garlic",["garlic","lahsun","लहसुन","લસણ"]],
["turai",["turai","ridge gourd","तुरई","તુરીયા"]]
];
for(const [key,words] of aliases){
if(words.some(w=>s.includes(w)))return photos[key];
}
return "";
}

const loginBox=document.getElementById("loginBox");
const dashboard=document.getElementById("dashboard");
const status=document.getElementById("status");
const vegList=document.getElementById("vegList");

document.getElementById("login").onclick=async()=>{
try{
await signInWithEmailAndPassword(auth,
document.getElementById("email").value.trim(),
document.getElementById("password").value);
}catch(e){
document.getElementById("message").textContent=e.code+": "+e.message;
}
};

onAuthStateChanged(auth,user=>{
loginBox.style.display=user?"none":"block";
dashboard.style.display=user?"block":"none";
if(user)loadVegetables();
});

function makeCard(item){
const v=item.data();
const card=document.createElement("div");
card.className="card";

const img=document.createElement("img");
img.className="photo";
img.src=getPhoto(item,v);
img.alt=v.name||item.id;
if(!img.src || img.src===location.href){
img.style.display="none";
}

const name=document.createElement("h3");
name.textContent=v.name||item.id;

const price=document.createElement("div");
price.className="price";
price.textContent="₹"+(v.price??0)+" / kg";

const availability=document.createElement("p");
availability.className="status";
availability.textContent=v.available?"● Available":"● Unavailable";
availability.style.color=v.available?"#16833b":"#c62828";

let quantity=1;
const qty=document.createElement("div");
qty.className="quantity";

const minus=document.createElement("button");
minus.textContent="−";
const count=document.createElement("span");
count.textContent=quantity;
const plus=document.createElement("button");
plus.textContent="+";

minus.onclick=()=>{
if(quantity>1)quantity--;
count.textContent=quantity;
};
plus.onclick=()=>{
quantity++;
count.textContent=quantity;
};

qty.append(minus,count,plus);

const actions=document.createElement("div");
actions.className="actions";

const update=document.createElement("button");
update.textContent="Edit Price";
update.onclick=async()=>{
const answer=prompt("Naya price per kg:",v.price);
if(answer===null)return;
const p=Number(answer);
if(answer.trim()===""||!Number.isFinite(p)||p<0){
alert("Sahi price likho");
return;
}
try{
await updateDoc(doc(db,"vegetables",item.id),{price:p});
status.textContent="Price updated!";
loadVegetables();
}catch(e){status.textContent=e.code+": "+e.message;}
};

const toggle=document.createElement("button");
toggle.className="gray";
toggle.textContent=v.available?"Unavailable":"Available";
toggle.onclick=async()=>{
try{
await updateDoc(doc(db,"vegetables",item.id),{available:!v.available});
loadVegetables();
}catch(e){status.textContent=e.code+": "+e.message;}
};

const remove=document.createElement("button");
remove.className="red";
remove.textContent="Delete";
remove.onclick=async()=>{
if(confirm("Kya ye sabzi delete karni hai?")){
try{
await deleteDoc(doc(db,"vegetables",item.id));
loadVegetables();
}catch(e){status.textContent=e.code+": "+e.message;}
}
};

actions.append(update,toggle,remove);
card.append(img,name,price,availability,qty,actions);
return card;
}

async function loadVegetables(){
vegList.textContent="Loading...";
try{
const snap=await getDocs(collection(db,"vegetables"));
vegList.innerHTML="";
if(snap.empty){
vegList.textContent="Abhi koi sabzi nahi hai";
return;
}
snap.forEach(item=>vegList.appendChild(makeCard(item)));
}catch(e){
vegList.textContent=e.code+": "+e.message;
}
}

document.getElementById("addVeg").onclick=async()=>{
const name=document.getElementById("vegName").value.trim();
const priceText=document.getElementById("vegPrice").value;
const price=Number(priceText);
const image=document.getElementById("vegImage").value.trim();

if(!name||priceText===""||!Number.isFinite(price)||price<0){
status.textContent="Naam aur sahi price bharo";
return;
}
try{
await addDoc(collection(db,"vegetables"),{
name,price,image,available:true
});
document.getElementById("vegName").value="";
document.getElementById("vegPrice").value="";
document.getElementById("vegImage").value="";
status.textContent="Sabzi add ho gayi!";
loadVegetables();
}catch(e){
status.textContent=e.code+": "+e.message;
}
};

document.getElementById("logout").onclick=()=>signOut(auth);
</script>
</body>
</html>
